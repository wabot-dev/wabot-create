name: main
on:
  push:
    branches: ['main']

permissions:
  id-token: write
  contents: read

jobs:
  quality:
    name: Quality Gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wabot-create
    steps:
      - uses: actions/checkout@v5
        name: Checkout
        with:
          path: wabot-create

      # The smoke tests read the packaged skills from the framework. Locally they
      # come from the sibling checkout (../wabot-ts); here it is recreated.
      - uses: actions/checkout@v5
        name: Checkout framework skills
        with:
          repository: wabot-dev/wabot-ts
          path: wabot-ts
          sparse-checkout: skills

      - uses: actions/setup-node@v5
        name: Setup Node.js
        with:
          node-version-file: wabot-create/.nvmrc
          cache: npm
          cache-dependency-path: wabot-create/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Smoke tests
        run: npm run test:smoke

  check-versions:
    name: Check Versions
    environment: production
    runs-on: ubuntu-latest
    outputs:
      publishedVersion: ${{ steps.versions.outputs.publishedVersion }}
      pushedVersion: ${{ steps.versions.outputs.pushedVersion }}
    steps:
      - uses: actions/checkout@v5
        name: Checkout
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
        name: Setup Node.js
      - id: versions
        name: Query versions
        run: |
          PUSHED_VERSION=$(cat package-lock.json | jq -r '.version')

          if [[ "$PUSHED_VERSION" == *"beta"* ]]; then
            PUBLISHED_VERSION=$(npm view @wabot-dev/create dist-tags.beta)
          else
            PUBLISHED_VERSION=$(npm view @wabot-dev/create version)
          fi

          echo "PUBLISHED_VERSION=$PUBLISHED_VERSION"
          echo "PUSHED_VERSION=$PUSHED_VERSION"

          echo "publishedVersion=$PUBLISHED_VERSION" >> "$GITHUB_OUTPUT"
          echo "pushedVersion=$PUSHED_VERSION" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish
    environment: production
    needs: [check-versions, quality]
    runs-on: ubuntu-latest
    if: ${{ needs.check-versions.outputs.publishedVersion != needs.check-versions.outputs.pushedVersion }}
    steps:
      - uses: actions/checkout@v5
        name: Checkout

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
        name: Setup Node.js

      - name: Run publish
        run: |
          VERSION_TO_PUBLISH=${{ needs.check-versions.outputs.pushedVersion }}

          # npm 11 supports OIDC trusted publishing and runs on the pinned Node
          # (.nvmrc); npm@latest (12+) requires Node >=22.22.2.
          npm install -g npm@11

          # Nothing to build: the package ships bin/ and lib/ as they are.
          if [[ "$VERSION_TO_PUBLISH" == *"beta"* ]]; then
            npm publish --access=public --tag beta
          else
            npm publish --access=public
          fi
